<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>Angkor Dub Studio</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;padding:12px;background:#0b1120;color:#f1f5f9}
.wrap{max-width:900px;margin:auto}
.card{background:#111c33;border:1px solid #263659;border-radius:14px;padding:12px;margin-bottom:12px}
h1{font-size:20px;color:#fcd34d}
h3{font-size:14px;color:#fcd34d}
button,input,select{background:#1e293b;color:white;border:1px solid #3b527e;padding:9px;border-radius:8px;margin:3px}
button{cursor:pointer}
.gold{background:#f59e0b;color:#111827;font-weight:bold}
.green{background:#16a34a}
.blue{background:#2563eb}
.red{background:#dc2626}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
video{width:100%;max-height:300px;background:black}
textarea{width:100%;min-height:75px;background:#0f172a;color:white;border:1px solid #334a77;border-radius:8px;padding:8px}
.cue{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:9px;margin:8px 0}
.time{width:145px;font-size:12px}
#status{color:#4ade80;word-break:break-word}
#list{max-height:450px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>🏯 Angkor Dub Studio</h1>
<p>ដកស្រង់ចិន • បកប្រែខ្មែរ • សំឡេងប្រុស/ស្រី</p>
<button class="gold" onclick="setKey()">🔑 API Key</button>
<select id="model">
<option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
<option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
</select>
</div>

<div class="card">
<h3>🎬 ១. វីដេអូ / SRT</h3>
<input type="file" id="file" accept="video/*,audio/*">
<input type="file" id="srtfile" accept=".srt,.txt">
<div id="videoBox" style="display:none">
<video id="video" controls playsinline></video>
</div>
<div class="row">
<button class="gold" onclick="extract()">💻 ស្រង់ចិន</button>
<button class="blue" onclick="aiExtract(true)">✨ AI ស្រង់ + បកប្រែ</button>
<button onclick="aiExtract(false)">📝 ស្រង់ចិនដើម</button>
<button class="green" onclick="translateSRT()">🔄 បកប្រែ SRT</button>
</div>
<p id="status">សូមជ្រើសវីដេអូ ឬ SRT</p>
</div>

<div class="card">
<h3>🎚️ ២. សំឡេង</h3>
<label>🔇 បិទសំឡេងដើម
<input type="checkbox" id="mute" checked>
</label>
<label>ល្បឿន
<select id="speed">
<option value="1">1.0x</option>
<option value="1.15" selected>1.15x</option>
<option value="1.3">1.3x</option>
</select>
</label>
<label>ប្រុស
<select id="male">
<option value="0.8">ទាប</option>
<option value="1">ធម្មតា</option>
</select>
</label>
<label>ស្រី
<select id="female">
<option value="1.2">ធម្មតា</option>
<option value="1.4">ខ្ពស់</option>
</select>
</label>
<div class="row">
<button class="green" onclick="playDub()">▶️ ចាក់វីដេអូ + Dub</button>
<button class="blue" onclick="readAll()">🔊 អានទាំងអស់</button>
<button class="red" onclick="stop()">⏹️ ឈប់</button>
</div>
</div>

<div class="card">
<h3>📝 ៣. កាត់ត Subtitle</h3>
<div class="row">
<button onclick="add()">➕ បន្ថែម</button>
<button onclick="allGender('M')">👨 ប្រុសទាំងអស់</button>
<button onclick="allGender('F')">👩 ស្រីទាំងអស់</button>
<button class="green" onclick="saveSrt(false)">💾 Save SRT</button>
<button class="gold" onclick="saveSrt(true)">💾 Save ស្អាត</button>
</div>
<div id="list"></div>
<hr>
<h3>📄 SRT</h3>
<textarea id="raw" rows="12" placeholder="Paste SRT នៅទីនេះ..." oninput="parseRaw()"></textarea>
</div>

</div>

<script>
const $=id=>document.getElementById(id);
let file=null,cues=[],asr=null,playing=false;

function status(t){$("status").innerText=t}

function setKey(){
 let k=prompt("បញ្ចូល Gemini API Key:",localStorage.getItem("g_key")||"");
 if(k!==null){
 localStorage.setItem("g_key",k.trim());
 status("រក្សាទុក API Key រួច!");
 }
}

$("file").onchange=e=>{
 file=e.target.files[0];
 if(!file)return;
 if(file.type.startsWith("video")){
 $("video").src=URL.createObjectURL(file);
 $("videoBox").style.display="block";
 }
 status("បានជ្រើស: "+file.name);
};

$("srtfile").onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
 $("raw").value=r.result;
 parseRaw();
 status("បានបើក SRT!");
 };
 r.readAsText(f);
};

function sec(t){
 let m=String(t).match(/(\d+):(\d+):(\d+)[,.](\d+)/);
 if(!m)return 0;
 return +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
}

function time(s){
 s=Math.max(0,s||0);
 let h=Math.floor(s/3600);
 let m=Math.floor(s%3600/60);
 let ss=Math.floor(s%60);
 let ms=Math.round((s-Math.floor(s))*1000);
 if(ms>=1000){ss++;ms=0}
 return String(h).padStart(2,"0")+":"+
 String(m).padStart(2,"0")+":"+
 String(ss).padStart(2,"0")+","+
 String(ms).padStart(3,"0");
}

function fmt(t){
 t=String(t||"").trim().replace(".",",");
 if(/^\d+:\d+,\d+$/.test(t))t="00:"+t;
 if(/^\d+:\d+:\d+$/.test(t))t+=",000";
 if(/^\d+:\d+:\d+,\d+$/.test(t))return t;
 return "00:00:00,000";
}

function parseRaw(){
 cues=[];
 let blocks=$("raw").value.trim().split(/\n\s*\n/);
 blocks.forEach(b=>{
 let lines=b.split(/\r?\n/).filter(x=>x.trim());
 if(!lines.length)return;
 let ti=lines.findIndex(x=>x.includes("-->"));
 if(ti<0)return;
 let p=lines[ti].split("-->");
 let s=fmt(p[0]),e=fmt(p[1]);
 let txt=lines.slice(ti+1).join(" ").trim();
 let g="M";
 if(txt.startsWith("[ស្រី]")){
 g="F";txt=txt.replace("[ស្រី]","").trim();
 }
 if(txt.startsWith("[ប្រុស]")){
 txt=txt.replace("[ប្រុស]","").trim();
 }
 cues.push({s,e,ss:sec(s),es:sec(e),g,t:txt});
 });
 render();
}

function raw(){
 $("raw").value=cues.map((c,i)=>
 (i+1)+"\n"+c.s+" --> "+c.e+"\n"+
 (c.g==="F"?"[ស្រី] ":"[ប្រុស] ")+c.t
 ).join("\n\n");
}

function render(){
 $("list").innerHTML=cues.map((c,i)=>`
 <div class="cue">
 <div class="row">
 <input class="time" value="${c.s}" onchange="setTime(${i},'s',this.value)">
 <input class="time" value="${c.e}" onchange="setTime(${i},'e',this.value)">
 <button onclick="gender(${i})">${c.g==="F"?"👩 ស្រី":"👨 ប្រុស"}</button>
 <button onclick="say(${i})">🔊</button>
 <button onclick="seek(${i})">⏱️</button>
 <button class="red" onclick="del(${i})">🗑️</button>
 </div>
 <textarea oninput="cues[${i}].t=this.value;raw()">${escapeHTML(c.t)}</textarea>
 </div>
 `).join("");
 raw();
}

function escapeHTML(s){
 return String(s||"").replace(/&/g,"&amp;")
 .replace(/</g,"&lt;").replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function setTime(i,k,v){
 cues[i][k]=fmt(v);
 cues[i].ss=sec(cues[i].s);
 cues[i].es=sec(cues[i].e);
 raw();
}

function gender(i){
 cues[i].g=cues[i].g==="F"?"M":"F";
 render();
}
function allGender(g){
 cues.forEach(c=>c.g=g);
 render();
}
function del(i){
 cues.splice(i,1);
 render();
}
function add(){
 let s=cues.length?cues[cues.length-1].es:0;
 cues.push({s:time(s),e:time(s+3),ss:s,es:s+3,g:"M",t:""});
 render();
}
function seek(i){
 if($("video").src){
 $("video").currentTime=cues[i].ss;
 }
}

function stop(){
 playing=false;
 speechSynthesis.cancel();
 $("video").pause();
}

function say(i){
 stop();
 speech(cues[i].t,cues[i].g);
}

function speech(t,g){
 let u=new SpeechSynthesisUtterance(t);
 u.lang="km-KH";
 u.rate=1.05;
 u.pitch=g==="F"?+$("female").value:+$("male").value;
 speechSynthesis.speak(u);
}

async function readAll(){
 stop();
 for(let c of cues){
 await new Promise(res=>{
 let u=new SpeechSynthesisUtterance(c.t);
 u.lang="km-KH";
 u.pitch=c.g==="F"?+$("female").value:+$("male").value;
 u.onend=res;
 u.onerror=res;
 speechSynthesis.speak(u);
 });
 }
}

async function playDub(){
 if(!cues.length)return alert("មិនទាន់មាន Subtitle!");
 stop();
 playing=true;
 let v=$("video");
 if(v.src){
 v.muted=$("mute").checked;
 v.playbackRate=+$("speed").value;
 v.play();
 }
 for(let i=0;i<cues.length;i++){
 if(!playing)break;
 let c=cues[i];
 if(v.src && v.currentTime<c.ss)v.currentTime=c.ss;
 await new Promise(res=>{
 let u=new SpeechSynthesisUtterance(c.t);
 u.lang="km-KH";
 u.pitch=c.g==="F"?+$("female").value:+$("male").value;
 u.rate=1.05;
 u.onend=res;
 u.onerror=res;
 speechSynthesis.speak(u);
 });
 }
 playing=false;
}

function saveSrt(clean){
 let text=cues.map((c,i)=>
 (i+1)+"\n"+c.s+" --> "+c.e+"\n"+
 (clean?"":(c.g==="F"?"[ស្រី] ":"[ប្រុស] "))+c.t
 ).join("\n\n");
 let blob=new Blob([text],{type:"text/plain;charset=utf-8"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="AngkorDub.srt";
 a.click();
}

async function api(parts){
 const key=localStorage.getItem("g_key");
 if(!key)throw Error("សូមបញ្ចូល API Key ជាមុន!");
 let model=$("model").value;
 let r=await fetch(
 "https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key),
 {
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({contents:[{parts}]})
 });
 let j=await r.json();
 if(j.error)throw Error(j.error.message);
 return j.candidates?.[0]?.content?.parts?.[0]?.text||"";
}

function jsonArray(txt){
 let m=txt.match(/\[[\s\S]*\]/);
 if(!m)throw Error("AI មិនបានបញ្ជូន JSON!");
 return JSON.parse(m[0]);
}

async function aiExtract(km){
 if(!file)return alert("សូមជ្រើសវីដេអូជាមុន!");
 if(file.size>18*1024*1024)
 return alert("File ធំពេក! សូមប្រើ Whisper ឬ SRT!");
 try{
 status("AI កំពុងដំណើរការ...");
 let prompt=km?
 `ស្រង់សំឡេងក្នុងវីដេអូ ហើយបកប្រែទៅខ្មែរនិយាយធម្មជាតិ សម្រាប់ Dub។
 កំណត់ពេលវេលា និងភេទអ្នកនិយាយ។
 បញ្ជូន JSON Array តែប៉ុណ្ណោះ៖
 [{"in":"00:00:01,000","out":"00:00:04,000","gender":"M","text":"អត្ថបទ"}]`
 :
 `ស្រង់សំឡេងភាសាដើមពីវីដេអូ។ កុំបកប្រែ។
 បញ្ជូន JSON Array តែប៉ុណ្ណោះ៖
 [{"in":"00:00:01,000","out":"00:00:04,000","gender":"M","text":"អត្ថបទ"}]`;
 let b=await new Promise(res=>{
 let r=new FileReader();
 r.onload=()=>res(r.result.split(",")[1]);
 r.readAsDataURL(file);
 });
 let txt=await api([
 {text:prompt},
 {inline_data:{mime_type:file.type||"audio/mp3",data:b}}
 ]);
 cues=jsonArray(txt).map(x=>{
 let s=fmt(x.in),e=fmt(x.out);
 return{s,e,ss:sec(s),es:sec(e),g:String(x.gender).toUpperCase()==="F"?"F":"M",t:x.text||""};
 });
 render();
 status("AI រួចរាល់! "+cues.length+" ជួរ");
 }catch(e){status("ERROR: "+e.message)}
}

async function translateSRT(){
 if(!cues.length)parseRaw();
 if(!cues.length)return alert("សូមបញ្ចូល SRT ឬដកស្រង់ចិន!");
 try{
 status("កំពុងបកប្រែ...");
 let original=cues.map((c,i)=>i+". "+c.t).join("\n");
 let txt=await api([{text:
 `បកប្រែអត្ថបទខាងក្រោមទៅជាភាសាខ្មែរនិយាយធម្មជាតិ
 សម្រាប់សំឡេង Dub។ រក្សាលេខជួរដដែល។
 បញ្ជូនតែ JSON Array ["អត្ថបទ1","អត្ថបទ2"]:\n${original}`
 }]);
 let m=txt.match(/\[[\s\S]*\]/);
 if(!m)throw Error("ទិន្នន័យមិនត្រឹមត្រូវ");
 let arr=JSON.parse(m[0]);
 arr.forEach((t,i)=>{if(cues[i])cues[i].t=t});
 render();
 status("បកប្រែរួចរាល់!");
 }catch(e){status("ERROR: "+e.message)}
}

async function extract(){
 if(!file)return alert("សូមជ្រើសវីដេអូជាមុន!");
 try{
 status("កំពុងទាញយក Whisper...");
 if(!asr){
 const {pipeline,env}=await import(
 "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
 env.allowLocalModels=false;
 env.useBrowserCache=true;
 asr=await pipeline("automatic-speech-recognition",
 "Xenova/whisper-tiny");
 }
 status("កំពុងបំបែកសំឡេង...");
 const ab=await file.arrayBuffer();
 const ac=new AudioContext();
 const dec=await ac.decodeAudioData(ab);
 const pcm=dec.getChannelData(0);
 const step=20*16000;
 cues=[];
 for(let i=0;i<pcm.length;i+=step){
 let part=pcm.slice(i,Math.min(i+step,pcm.length));
 let s=i/dec.sampleRate;
 status("Whisper: "+Math.round(i/pcm.length*100)+"%");
 let res=await asr(part,{language:"chinese",task:"transcribe"});
 if(res.text?.trim()){
 let t=res.text.trim();
 cues.push({s:time(s),e:time(s+20),ss:s,es:s+20,g:"M",t});
 }
 }
 render();
 status("ដកស្រង់រួចរាល់!");
 ac.close();
 }catch(e){status("ERROR: "+e.message)}
}
</script>
</body>
</html>
